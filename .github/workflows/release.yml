name: Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Read the version from the tag
        run: |
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "This workflow publishes a tagged version; run it on a tag." >&2
            exit 1
          fi
          echo "BARCAROLE_VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      # Unlike the development build, a published version has no business falling back to a
      # throwaway key: an unsigned release APK cannot be installed at all.
      - name: Restore the upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No upload key configured; a release cannot be signed." >&2
            exit 1
          fi
          mkdir -p keystore
          printf '%s' "$KEYSTORE_BASE64" | tr -d '\n\r' | base64 -d > keystore/upload.jks
          if [ ! -s keystore/upload.jks ]; then
            echo "The upload key secret did not decode to a keystore." >&2
            exit 1
          fi

      # The APK is what a phone installs directly; the bundle is what the Play Store takes.
      - name: Build the APK and the bundle
        env:
          BARCAROLE_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          BARCAROLE_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          BARCAROLE_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease --stacktrace

      - name: Name both after the tag
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/barcarole-${GITHUB_REF_NAME}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "dist/barcarole-${GITHUB_REF_NAME}.aab"
          ls -l dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.apk
            dist/*.aab
          generate_release_notes: true
          body: |
            Install the **.apk** on a phone. The **.aab** is the bundle the Play Store takes;
            it cannot be installed directly.
