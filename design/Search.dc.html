<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap">
  <style>
    :root {
      --bg: #0E1526;
      --surface: #141C31;
      --surface-hi: #1B2440;
      --surface-sel: #123A4A;
      --on: #E6EBF5;
      --on-var: #97A3BF;
      --primary: #00DCDF;
      --on-primary: #00363A;
      --coral: #FF8F6C;
      --outline: #29334F;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Roboto, system-ui, -apple-system, sans-serif; }
    .screen {
      width: 390px; height: 844px; background: var(--bg); color: var(--on);
      display: flex; flex-direction: column; overflow: hidden;
    }
    .appbar {
      height: 64px; display: flex; align-items: center; gap: 4px;
      padding: 0 4px 0 16px; flex: 0 0 auto;
    }
    .appbar h1 { font-size: 22px; font-weight: 400; margin: 0; flex: 1; }
    .iconbtn {
      width: 48px; height: 48px; display: flex; align-items: center; justify-content: center;
      border-radius: 24px; color: var(--on-var); flex: 0 0 auto;
    }
    .tabs { display: flex; border-bottom: 1px solid var(--outline); flex: 0 0 auto; }
    .tab {
      flex: 1; height: 48px; display: flex; align-items: center; justify-content: center;
      font-size: 14px; font-weight: 500; color: var(--on-var);
    }
    .tab.on { color: var(--primary); box-shadow: inset 0 -3px 0 var(--primary); }
    .list { flex: 1; overflow: hidden; }
    .row { display: flex; align-items: center; gap: 12px; padding: 8px 16px; height: 64px; }
    .art { border-radius: 8px; flex: 0 0 auto; display: flex; align-items: center; justify-content: center; }
    .meta { flex: 1; min-width: 0; }
    .t1 { font-size: 16px; line-height: 22px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .t2 { font-size: 12px; line-height: 16px; color: var(--on-var); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .dur { font-size: 12px; color: var(--on-var); font-variant-numeric: tabular-nums; }
    .rail { width: 24px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; padding: 8px 0; }
    .rail span { font-size: 10px; line-height: 12px; color: rgba(151,163,191,.35); }
    .rail span.on { color: var(--primary); }
    .mini { background: var(--surface-hi); flex: 0 0 auto; }
    .mini-row { display: flex; align-items: center; gap: 12px; padding: 8px 12px; }
    .bar { height: 4px; background: var(--outline); }
    .bar i { display: block; height: 4px; background: var(--primary); }
    .navspace { height: 24px; background: var(--surface-hi); }
    .section { font-size: 14px; font-weight: 500; color: var(--primary); padding: 16px 16px 4px; }
    .btn {
      height: 48px; border-radius: 24px; display: flex; align-items: center; justify-content: center;
      gap: 8px; font-size: 14px; font-weight: 500; flex: 1;
    }
    .btn.fill { background: var(--primary); color: var(--on-primary); }
    .btn.out { border: 1px solid var(--outline); color: var(--on); }
    a { color: var(--primary); } a:hover { color: var(--coral); }

  </style>
</helmet>
<div class="screen">
<div class="appbar" style="padding:0 4px;height:72px">
  <div class="iconbtn"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"></path><path d="M12 19l-7-7 7-7"></path></svg></div>
  <div style="flex:1;height:48px;background:var(--surface-hi);border-radius:24px;display:flex;align-items:center;gap:12px;padding:0 16px">
    <span style="color:var(--on-var)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg></span>
    <span style="font-size:16px">blue</span>
    <span style="width:2px;height:20px;background:var(--primary)"></span>
  </div>
  <div style="width:8px"></div>
</div>
<div class="list">
  <div class="section">Songs</div>
  <div class="row" style="height:56px"><div class="meta"><div class="t1">Blue in Green</div><div class="t2">Miles Davis · Kind of Blue</div></div><div class="dur">5:37</div></div>
  <div class="row" style="height:56px"><div class="meta"><div class="t1">All Blues</div><div class="t2">Miles Davis · Kind of Blue</div></div><div class="dur">11:33</div></div>
  <div class="section">Albums</div>
  <div class="row" style="height:56px"><div class="meta"><div class="t1">Kind of Blue</div><div class="t2">Miles Davis · 5 tracks</div></div></div>
  <div class="row" style="height:56px"><div class="meta"><div class="t1">Blue Train</div><div class="t2">John Coltrane · 5 tracks</div></div></div>
  <div class="section">Artists</div>
  <div class="row" style="height:64px"><div class="art" style="width:40px;height:40px;background:var(--surface-hi);border-radius:20px;color:var(--on-var)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.5"></circle><path d="M5 20a7 7 0 0 1 14 0"></path></svg></div><div class="meta"><div class="t1">Blue Öyster Cult</div><div class="t2">3 albums · 26 songs</div></div></div>
  <div class="section">Folders</div>
  <div class="row" style="height:64px"><div class="art" style="width:40px;height:40px;background:var(--surface-hi);border-radius:20px;color:var(--on-var)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg></div><div class="meta"><div class="t1">Blue Note</div><div class="t2">/Music/Jazz/Blue Note · 42 songs</div></div></div>
</div>
<div class="mini">
  <div class="mini-row">
    <div class="meta"><div class="t1" style="font-size:14px">Digital love</div>
      <div class="t2">Daft Punk</div></div>
    <div class="iconbtn" style="width:44px;height:44px;color:var(--coral)"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-7-4.4-7-9.2A4 4 0 0 1 12 8a4 4 0 0 1 7 2.8C19 15.6 12 20 12 20z"></path></svg></div>
    <div class="iconbtn" style="width:44px;height:44px;color:var(--on)"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4v16M16 4v16"></path></svg></div>
    <div class="iconbtn" style="width:44px;height:44px;color:var(--on)"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4l10 8-10 8z"></path><path d="M19 4v16"></path></svg></div>
  </div>
  <div class="bar"><i style="width:42%"></i></div>
  <div class="navspace"></div>
</div>
</div>
</x-dc>
</body>
</html>
